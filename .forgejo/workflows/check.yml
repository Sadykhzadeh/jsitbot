# Type-check and test on every pull request and on every push to master.
#
# The only workflow here used to be the deploy, so a push went to production
# without anything having run the tests. This one does not gate the deploy; it
# makes a red commit visible within a minute.
name: check

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The only label this forge's runner answers to.
    runs-on: docker
    # The job takes about half a minute; a hang should not hold the runner longer.
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      # Under a second, so a type error is reported before the tests start.
      - name: Type check
        run: bun run typecheck

      # Three workers: the two slowest files, which wait on real time, then run
      # side by side instead of one after the other. More workers do not make it
      # faster and only give the tests that watch the clock a busier machine.
      - name: Test
        run: bun test --parallel=3
